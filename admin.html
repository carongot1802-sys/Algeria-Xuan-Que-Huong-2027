<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quản trị, Xuân Quê hương 2027</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header class="abar">
  <strong>Quản trị Xuân Quê hương 2027</strong>
  <span class="grow"></span>
  <span id="status" class="status">Chưa kết nối GitHub</span>
  <button id="btnConnect" class="b b-line" type="button">Kết nối GitHub</button>
  <button id="btnExport" class="b b-line" type="button">Tải content.json</button>
  <button id="btnPublish" class="b b-red" type="button">Xuất bản</button>
  <a class="b b-line" href="index.html" target="_blank" rel="noopener">Mở trang web</a>
</header>

<dialog id="dlgConnect" class="dlg">
  <h3>Kết nối GitHub</h3>
  <p class="hint">Cần một fine-grained token chỉ cấp quyền Contents (Read and write) cho đúng repo này. Token được giữ trong tab trình duyệt, không gửi đi đâu ngoài GitHub. Đừng chia sẻ token cho người khác.</p>
  <label>Tên tài khoản GitHub<input id="cOwner" placeholder="ten-tai-khoan"></label>
  <label>Tên repo<input id="cRepo" placeholder="xuan-que-huong-2027"></label>
  <label>Token<input id="cToken" type="password" placeholder="github_pat_..."></label>
  <label class="chk"><input id="cRemember" type="checkbox"> Nhớ token trên máy này</label>
  <p id="cMsg" class="msg"></p>
  <div class="row"><button class="b b-line" id="cCancel" type="button">Đóng</button><button class="b b-red" id="cOk" type="button">Kết nối</button></div>
</dialog>

<div class="layout">
  <nav class="tabs" id="tabs"></nav>
  <main id="main" class="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
